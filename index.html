<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151d22">
  <meta name="description" content="GymTracker — suivi simple de tes séances et de ta progression.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>GymTracker — BETA</title>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-brand">
      <span class="splash-mark" aria-hidden="true">✦</span>
      <strong>GymTracker</strong>
      <small>by Phantom</small>
      <div class="loading-area">
        <div class="loading-track" role="progressbar" aria-label="Chargement"><span class="loading-progress"></span></div>
        <p>Préparation de ton espace d'entraînement...</p>
      </div>
    </div>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✚</span><span><strong>GymTracker</strong><small>BETA <span class="version-tag" id="appVersion">0.5.8</span></small></span></div>
      <button class="icon-button" id="settingsBtn" aria-label="Paramètres">⚙</button>
    </header>
    <main id="app" class="main-content"></main>
    <nav class="bottom-nav" aria-label="Navigation">
      <button data-page="sessions"><span>▤</span>Séances</button>
      <button data-page="home" class="active"><span>⌂</span>Mes exercices</button>
    </nav>
  </div>
  <dialog id="settingsDialog">
    <div class="dialog-head"><h2>Paramètres</h2><button class="icon-button" id="closeSettings">✕</button></div>
    <p class="muted">Tes données restent enregistrées sur cet appareil.</p>
    <button class="secondary-button full" id="exportBtn">Exporter mes données (JSON)</button>
    <label class="secondary-button full file-label">Importer une sauvegarde JSON<input type="file" id="importFile" accept="application/json"></label>
    <button class="danger-button full" id="clearBtn">Effacer toutes les données</button>
  </dialog>
  <dialog id="updateDialog">
    <div class="dialog-head"><h2>Mise à jour disponible</h2></div>
    <p class="muted">Une nouvelle version de GymTracker est prête.</p>
    <button class="primary-button full" id="installUpdate">Télécharger et installer</button>
    <button class="secondary-button full" id="laterUpdate" style="margin-top:9px">Plus tard</button>
  </dialog>
  <script src="app.js"></script>
  <script>
    const splash = document.getElementById("splash");
    window.addEventListener("load", () => setTimeout(() => splash.classList.add("hide"), 650));
    const updateDialog = document.getElementById("updateDialog");
    const updateKey = "gymtracker-installed-release";
    fetch("./version.json", {cache:"no-store"}).then(r => r.json()).then(v => { document.getElementById("appVersion").textContent = v.release.replace(/-beta$/i, ""); }).catch(() => {});
    async function checkForUpdate() {
      try {
        const response = await fetch("./version.json", {cache:"no-store"});
        const info = await response.json();
        const installed = localStorage.getItem(updateKey) || "0.0.0-beta";
        if (installed !== info.release) updateDialog.showModal();
      } catch (_) {}
    }
    document.getElementById("laterUpdate").addEventListener("click", () => updateDialog.close());
    document.getElementById("installUpdate").addEventListener("click", async () => {
      const button = document.getElementById("installUpdate");
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "Installation en cours…";
      try {
        const info = await (await fetch("./version.json", {cache:"no-store"})).json();
        const registration = await navigator.serviceWorker.getRegistration();
        if (registration) {
          let controllerChanged = false;
          const changed = new Promise(resolve => {
            navigator.serviceWorker.addEventListener("controllerchange", () => {
              controllerChanged = true;
              resolve();
            }, {once:true});
          });
          await registration.update();
          if (registration.waiting) {
            registration.waiting.postMessage({type:"SKIP_WAITING"});
          } else if (registration.installing) {
            await new Promise(resolve => {
              const worker = registration.installing;
              if (!worker) return resolve();
              worker.addEventListener("statechange", () => {
                if (worker.state === "installed" || worker.state === "activated" || worker.state === "redundant") resolve();
              });
            });
            if (registration.waiting) registration.waiting.postMessage({type:"SKIP_WAITING"});
          }
          await Promise.race([changed, new Promise(resolve => setTimeout(resolve, 1800))]);
        }
        localStorage.setItem("gymtracker-installed-release", info.release);
        location.reload();
      } catch (error) {
        button.disabled = false;
        button.textContent = originalText;
        alert("La mise à jour n’a pas pu être installée. Vérifie ta connexion puis réessaie.");
      }
    });
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", async () => {
        try { await navigator.serviceWorker.register("./sw.js"); } catch (_) {}
        await checkForUpdate();
      });
    } else { window.addEventListener("load", checkForUpdate); }
  </script>
</body>
</html>
